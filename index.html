<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Serious Nutrition" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Serious Nutrition</title>
    <style>
      /* Start-Screen: deckt die Ladezeit ab, bis die App ihre Daten hat. Sieht genauso aus wie der
         native Splash (Logo 22 % der Bildschirmhöhe auf #0f1115), damit der Übergang nahtlos ist. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1115;
        transition: opacity 0.45s ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash .logo {
        position: relative;
        width: max(22vh, 22vw);
        aspect-ratio: 1;
        transform: translateY(-2%);
        animation: splash-breathe 2.2s ease-in-out infinite;
      }
      #splash.hide .logo {
        animation: splash-out 0.45s ease forwards;
      }
      #splash img {
        display: block;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 24px 60px rgba(0, 0, 0, 0.55));
      }
      /* Gold-Glanz, der über das Logo läuft: Verlauf, auf die Logo-Form maskiert */
      #splash .shine {
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 38%, rgba(255, 246, 214, 0.75) 50%, transparent 62%);
        background-size: 260% 100%;
        -webkit-mask: url('/splash-logo.png') center / contain no-repeat;
        mask: url('/splash-logo.png') center / contain no-repeat;
        animation: splash-shine 1.9s ease-in-out 0.35s infinite;
        mix-blend-mode: screen;
      }
      @keyframes splash-shine {
        0% { background-position: 120% 0; }
        55%, 100% { background-position: -40% 0; }
      }
      @keyframes splash-breathe {
        0%, 100% { transform: translateY(-2%) scale(1); }
        50% { transform: translateY(-2%) scale(1.035); }
      }
      @keyframes splash-out {
        to { transform: translateY(-2%) scale(1.12); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .logo, #splash .shine, #splash.hide .logo { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="logo">
        <img src="/splash-logo.png" alt="" />
        <div class="shine"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Mindestens 900 ms zeigen (sonst flackert es bei schnellem Start), spätestens nach 5 s weg.
      (function () {
        var el = document.getElementById('splash');
        var shown = Date.now();
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          var wait = Math.max(0, 900 - (Date.now() - shown));
          setTimeout(function () {
            el.classList.add('hide');
            setTimeout(function () { el.remove(); }, 500);
          }, wait);
        }
        window.__hideSplash = hide;
        setTimeout(hide, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
